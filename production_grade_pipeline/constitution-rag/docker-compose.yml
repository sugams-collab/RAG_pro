version: "3.9"

services:

  hybrid-rag:

    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: hybrid-rag

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - ../.env

    volumes:
      - ../data:/app/data
      - ../logs:/app/logs

    depends_on:
      - ollama

  ollama:

    image: ollama/ollama:latest

    container_name: ollama

    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama:/root/.ollama

volumes:

  ollama: